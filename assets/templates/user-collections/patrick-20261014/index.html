<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrick 用户可选模板集</title><meta name="referrer" content="no-referrer"><style>
:root{--bg:#f7f3e8;--ink:#203b61;--gold:#a87932;--line:#d8d6cb;--muted:#5c6670}*{box-sizing:border-box}body{margin:0;font:15px/1.75 "Microsoft YaHei UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}header,main,footer{max-width:1450px;margin:auto;padding:24px 34px}header{padding-top:38px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1{font:36px/1.3 SimSun,Georgia,serif;margin:13px 0}header p{margin:10px 0;font-size:14px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 25px}input,select,button{font:inherit}input,select{padding:9px 13px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:4px}input{width:min(320px,100%)}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:3px;padding:9px 12px}button:hover{border-color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.count{margin-left:auto;font-size:12px;align-self:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{border:1px solid var(--line);background:#fff;border-radius:4px;overflow:hidden}.thumb{display:block;border:0;border-radius:0;padding:0;width:100%;aspect-ratio:16/9;background:#edece7}.thumb img{height:100%;width:100%;object-fit:contain}.body{padding:15px 17px}.id{font-size:11px;color:var(--muted)}h2{font-size:17px;line-height:1.45;margin:6px 0}.tags{font-size:11px;color:var(--gold);margin:8px 0}.body p{font-size:12px;color:var(--muted);margin:8px 0;min-height:40px}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 17px 17px}.actions button,.actions a{font-size:12px}.actions a{padding:9px 2px;color:var(--ink)}.empty{padding:40px;text-align:center}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line)}dialog{width:min(1450px,94vw);max-height:94vh;padding:0;border:1px solid var(--ink);border-radius:5px;background:var(--bg)}dialog::backdrop{background:#142942dc}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:12px 18px}.top h2{margin:0}.stage{height:65vh;background:#e4e6e1;overflow:auto}.stage img{width:100%;height:100%;object-fit:contain}.bottom{padding:14px 18px;font-size:12px}.bottom p{margin:8px 0}.bottom button{font-size:12px}textarea{width:100%;height:82px;font:13px/1.65 "Microsoft YaHei",sans-serif;border:1px solid var(--line);padding:10px;color:var(--ink);background:white}#flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 22px;border-radius:4px;display:none;font-size:13px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}header,main,footer{padding-left:18px;padding-right:18px}.count{margin-left:0}h1{font-size:29px}input,select{width:100%}}
</style></head><body><header><div class="eyebrow">PATRICK / TEMPLATE LIBRARY</div><h1>用户可选模板集</h1><p id="summary">正在读取本地目录…</p><p>按页面要回答的问题选择版式，配色可以单独调整。点击样图放大，或复制使用指令发给当前 Agent。</p></header><main><div class="filters"><input type="search" id="search" placeholder="搜索名称、编号或用途" aria-label="搜索模板"><select id="group" aria-label="模板分组"><option value="">全部分组</option></select><select id="theme" aria-label="财务样张预览配色"><option value="shenzhen">深圳暖白·海军蓝金</option><option value="reference">财务样张参考配色</option></select><span class="count" id="count"></span></div><div class="grid" id="grid"></div></main><footer>原生 PPTX 样张、HTML 源码和视觉参考均保存在此安装包内。模板选择记录保留版式、图表和配色三个维度。<br>HTML 与参考图展示原版样图；换色和原生 PPTX 制作按本次需求执行。样张的演示数字与来源数字需替换为本次核实的数据。</footer><dialog id="modal"><div class="top"><h2 id="title"></h2><button id="close" aria-label="关闭大图">关闭</button></div><div class="stage"><img id="large" alt="模板大图"></div><div class="bottom"><button id="prev">上一张</button> <span id="page"></span> <button id="next">下一张</button><p id="detail"></p><textarea readonly id="prompt" aria-label="模板使用指令"></textarea><p><a id="source" target="_blank" rel="noopener noreferrer">查看原来源</a></p></div></dialog><div id="flash" role="status"></div><script src="catalog.js"></script><script>
'use strict';const C=window.TEMPLATE_CATALOG,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=null,imageIndex=0;const kinds={'native-pptx-pattern':'原生 PPTX 版式','html-layout-template':'HTML 版式','visual-reference-pattern':'视觉参考版式'};
function images(e){if(e.kind!=='native-pptx-pattern')return e.previewImages;const t=$('#theme').value;return e.previewImages.filter(p=>t==='shenzhen'?p.theme==='shenzhen':p.theme!=='shenzhen')}
function instruction(e){const requested=$('#theme').value==='reference'&&e.kind==='native-pptx-pattern'?'该模板参考配色':'深圳暖白、海军蓝、金色配色';return `使用幻灯片导演，选用模板 ${e.id}（${e.name}），采用${requested}。按本次资料和受众安排内容，先给故事线或按已确认阶段继续；版式与配色可独立调整，按本次要求制作可编辑 HTML/PPTX。`}
function render(){const q=$('#search').value.toLowerCase(),g=$('#group').value,rows=C.entries.filter(e=>(!g||e.group===g)&&(!q||[e.id,e.name,e.group,e.use].join(' ').toLowerCase().includes(q)));$('#count').textContent=rows.length+' / '+C.entries.length+' 项';$('#grid').innerHTML=rows.length?rows.map(e=>`<article class="card" data-id="${e.id}"><button class="thumb" data-preview="${e.id}" aria-label="放大 ${esc(e.name)}"><img loading="lazy" src="${esc(images(e)[0].path)}" alt="${esc(e.name)}"></button><div class="body"><div class="id">${esc(e.id)} · ${esc(kinds[e.kind])}</div><h2>${esc(e.name)}</h2><div class="tags">已选：${Object.entries(e.selected).filter(x=>x[1]).map(x=>({layout:'版式',chart:'图表',color:'配色'}[x[0]])).join(' / ')}</div><p>${esc(e.use)}</p></div><div class="actions"><button data-copy="${e.id}">复制使用指令</button>${e.nativeDecks?`<a href="${esc(e.nativeDecks.find(x=>$('#theme').value==='reference'?x.theme!=='shenzhen':x.theme==='shenzhen').path)}" download>下载 PPTX 样张</a>`:e.templateHtml?`<a href="${esc(e.templateHtml)}" download>下载 HTML 源码</a>`:`<a href="${esc(e.previewImages[0].path)}" download>下载参考图</a>`}</div></article>`).join(''):'<p class="empty">没有匹配模板。</p>'}
function show(){const list=images(active);$('#large').src=list[imageIndex].path;$('#page').textContent=(imageIndex+1)+' / '+list.length;$('#prev').disabled=imageIndex===0;$('#next').disabled=imageIndex===list.length-1}
function open(id){active=C.entries.find(e=>e.id===id);imageIndex=0;$('#title').textContent=active.id+' · '+active.name;$('#detail').textContent=kinds[active.kind]+'。'+active.use;$('#prompt').value=instruction(active);$('#source').href=/^https?:/.test(active.source)?active.source:'catalog.json';show();$('#modal').showModal()}
document.addEventListener('click',async e=>{const p=e.target.closest('[data-preview]'),b=e.target.closest('[data-copy]');if(p)open(p.dataset.preview);if(b){const entry=C.entries.find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText(instruction(entry));$('#flash').textContent='已复制使用指令';$('#flash').style.display='block';setTimeout(()=>$('#flash').style.display='none',2400)}catch{open(entry.id)}}});$('#close').onclick=()=>$('#modal').close();$('#prev').onclick=()=>{imageIndex--;show()};$('#next').onclick=()=>{imageIndex++;show()};$('#search').oninput=render;$('#group').onchange=render;$('#theme').onchange=render;$('#group').innerHTML+=[...new Set(C.entries.map(e=>e.group))].map(g=>`<option>${esc(g)}</option>`).join('');$('#summary').textContent=C.entries.length+' 项已选模板：23 个财务原生版式、8 套 HTML 版式、9 项视觉参考。';render();
</script></body></html>
